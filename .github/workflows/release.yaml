name: Release
on:
  workflow_dispatch:
    inputs:
      game_title:
        type: string
        description: Title of the game.
        required: true

env:
  GODOT_VERSION: "4.7"
  PROJECT_PATH: godot
  WINEPREFIX: /tmp/.wine

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install and Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: blender curl # Replace with your packages
          version: 1.0 # Bump this to force a cache bust
      
      - name: Install Godot Goodie Grabber
        run: |
          curl -fsSL https://github.com/godotneers/ggg/releases/latest/download/ggg-installer.sh | sh
          ggg sync

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true
      - name: Install dotNET
        uses: actions/setup-dotnet@v5
        with:
            dotnet-version: |
                10.0.x
      
      # - name: Cache APT Packages
      #   id: apt-cache
      #   uses: actions/cache@v4
      #   with:
      #     path: /var/cache/apt/archives
      #     key: ${{ runner.os }}-apt-${{ hashFiles('**/apt-packages.txt') }} # Or use a hardcoded string
      #     restore-keys: |
      #       ${{ runner.os }}-apt-
      # - name: Install APT packages
      #   run: |
      #     sudo apt-get update
      #     # Install your packages
      #     sudo apt-get install -y blender

      #     # Change ownership of the archives so actions/cache can save them
      #     sudo chown -R runner:docker /var/cache/apt/archives

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:mono-4.7
    needs: [setup]
    strategy:
      fail-fast: true
      matrix:
        include:
          - export: Windows
            extension: exe
            godot_export: Windows Desktop x86_64
            output_directory: dist/windows_x64
            export_name: windows_x64
          - export: Linux
            extension: x64
            godot_export: Linux x86_64
            output_directory: dist/linux_x64
            export_name: linux_x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Restore Godot editor cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/.godot/
          key: godot-editor-${{ env.GODOT_VERSION }}-${{ hashFiles(format('{0}/**/*.tscn', env.PROJECT_PATH), format('{0}/**/*.gd', env.PROJECT_PATH), format('{0}/**/*.import', env.PROJECT_PATH)) }}
          restore-keys: |
            godot-editor-${{ env.GODOT_VERSION }}-

      - name: Restore Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/
          key: godot-templates-${{ env.GODOT_VERSION }}
          restore-keys: |
            godot-templates-

      - name: Ensure LFS objects are present
        working-directory: ${{ github.workspace }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs install --local
          git lfs pull

      - name: Setup export template paths
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot || true
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono || true

      - name: Import project assets
        run: |
          godot --headless --import || true

      - name: Configure Godot Editor Settings for Headless Mode
        run: |
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          filesystem/import/blender/blender_path = "/usr/bin/blender"
          filesystem/import/blender/blender3_path = "/usr/bin/blender"
          EOF

      - name: Export build
        run: |
          mkdir -v -p ${{ matrix.output_directory }}
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "${{ matrix.godot_export }}" \
            "$EXPORT_DIR/${{ matrix.export_name }}/${{ inputs.game_title }}.${{ matrix.extension }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.export_name }}
          path: ${{ matrix.output_directory }}

  release:
    name: Release Distributables
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write

    steps:
      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%d-%m')"
      - name: Get current time
        id: time
        run: echo "::set-output name=time::$(date + '%H:%M:%S')"
      
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get branch name
        id: get_branch
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV

      - name: Download Linux Artifact
        uses: actions/download-artifact@v5
        with:
          name: linux_x64
      
      - name: Download Windows Artifact
        uses: actions/download-artifact@v5
        with:
          name: windows_x64
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.date.outputs.date }}.${{ github.run_id }}
          release_name: Build ${{ steps.date.outputs.date }}.${{ github.run_id }}
          body: |
              Metadata        | Value 
              ----------------|---------------------------------------------------------------
              Build Timestamp | ${{ steps.date.outputs.date }} ${{ steps.date.outputs.time }} 
              Build ID        | `${{ steps.date.outputs.date }}.${{ github.run_id }}`

              ## Higlights! 🤩

              - …

              ## What's New? ✨📦

              - …

              ## What's Changed? 🔍

              - …

              ## Bug Fixes 🎶🎷🐛

              - …

          draft: true
          prerelease: true
    
      - name: Upload Linux Release Assets
        id: upload-linux-x64-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
            upload_url: ${{ steps.create_release.outputs.upload_url }}
            asset_path: linux_x64.zip
            asset_name: ${{ inputs.game_title }}-linux_x64.zip
            asset_content_type: application/zip
      
      - name: Upload Windows Release Assets
        id: upload-windows-x64-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
            upload_url: ${{ steps.create_release.outputs.upload_url }}
            asset_path: windows_x64.zip
            asset_name: ${{ inputs.game_title }}-windows_x64.zip
            asset_content_type: application/zip
